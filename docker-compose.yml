services:
  salaconnect:
    build: .
    container_name: salaconnect
    restart: always
    ports:
      - "3405:3405"
    env_file:
      - .env
    environment:
      - PORT=3405
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./src:/app/src
      - ./control_center.cjs:/app/control_center.cjs
      - ./server.cjs:/app/server.cjs

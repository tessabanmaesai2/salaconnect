<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALA CONNECT — พิมพ์รายงานและแบบเสนอโครงการ</title>
  <link rel="icon" type="image/png" href="logo/logoicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
  <link rel="stylesheet" href="lib/fa.min.css">
  <style>
    .filter-grid-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      align-items: flex-end;
    }
    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filter-item label {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate-600);
    }
    .filter-item select, .filter-item input {
      font-family: var(--font-body);
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--slate-300);
      background: #ffffff;
      outline: none;
    }
    .filter-item select:focus, .filter-item input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body class="print-preview-mode">

  <!-- 🏛️ Authentic SALA CONNECT Header (Screen Only) -->
  <header class="app-header no-print">
    <div class="header-inner">
      <div class="brand-section">
        <img src="logo/logoicon.png" alt="ตราเทศบาลตำบลแม่สาย" class="brand-logo" onerror="this.src='logo/original_embedded_logo.png'">
        <div class="brand-titles">
          <span class="brand-main">SALA CONNECT</span>
          <span class="brand-sub">ระบบพิมพ์รายงานเอกสารข้อเสนอโครงการ เทศบาลตำบลแม่สาย</span>
        </div>
      </div>
      <div class="header-nav">
        <a href="/sala/manage" class="btn-header">
          <i class="fas fa-arrow-left"></i> กลับหน้าจัดการ (/manage)
        </a>
        <button type="button" class="btn-header" onclick="exportPDF()" style="background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.35);">
          <i class="fas fa-file-pdf"></i> ส่งออกเป็น PDF (Export PDF)
        </button>
        <button type="button" class="btn-header btn-header-gold" onclick="window.print()">
          <i class="fas fa-print"></i> สั่งพิมพ์ (Print)
        </button>
      </div>
    </div>
  </header>
  <div class="credit-bar no-print">พัฒนาโดย กองยุทธศาสตร์ฯ (V4.0.0)</div>

  <!-- 🎛️ Comprehensive Filter Bar (Screen Only) -->
  <div class="print-control-bar no-print" style="padding: 14px 24px;">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div class="filter-grid-bar">
        <div class="filter-item" style="grid-column: 1 / -1; margin-bottom: 6px;">
          <label style="color: var(--primary-dark); font-weight: 700;">
            <i class="fas fa-edit"></i> หัวข้อรายงาน (ผู้ใช้สามารถแก้ไขข้อความหัวข้อได้อิสระ หรือคลิกพิมพ์แก้บนหน้ากระดาษโดยตรง):
          </label>
          <input type="text" id="customReportTitleInput" value="แบบสรุปข้อเสนอโครงการและปัญหาความต้องการของประชาชน" oninput="onCustomTitleChange(this.value)" style="font-weight: 600; color: #1e293b; padding: 8px 12px; font-size: 0.95rem;">
        </div>

        <div class="filter-item" style="grid-column: span 1;">
          <label>รูปแบบรายงาน</label>
          <select id="reportTemplateSelect" onchange="renderSelectedTemplate()">
            <option value="summary_table">ตารางสรุปข้อเสนอ (A4 แนวนอน)</option>
            <option value="summary_with_photos">ตารางสรุป + ภาคผนวกภาพถ่ายและรายละเอียด (แยกหน้า)</option>
            <option value="photo_appendix">เฉพาะภาคผนวกภาพถ่ายและรายละเอียดสภาพปัญหา (A4 แยกจากตาราง)</option>
            <option value="individual_form">แบบเสนอโครงการรายบุคคล (A4 แนวตั้ง)</option>
            <option value="community_summary">สรุปจำนวนแยกรายชุมชน (A4 แนวตั้ง)</option>
          </select>
        </div>

        <div class="filter-item">
          <label>ปี พ.ศ.</label>
          <select id="printYearFilter" onchange="renderSelectedTemplate()">
            <option value="all">ทุกปี (ทั้งหมด)</option>
            <option value="2569">พ.ศ. 2569</option>
            <option value="2568">พ.ศ. 2568</option>
            <option value="2567">พ.ศ. 2567</option>
          </select>
        </div>

        <div class="filter-item">
          <label>ชุมชน / หมู่บ้าน</label>
          <select id="printCommunityFilter" onchange="renderSelectedTemplate()">
            <option value="all">ทุกชุมชน (10 ชุมชน)</option>
          </select>
        </div>

        <div class="filter-item">
          <label>สถานะ</label>
          <select id="printStatusFilter" onchange="renderSelectedTemplate()">
            <option value="all">ทุกสถานะ</option>
          </select>
        </div>

        <div class="filter-item">
          <label>ตั้งแต่วันที่</label>
          <input type="date" id="printDateFrom" onchange="renderSelectedTemplate()">
        </div>

        <div class="filter-item">
          <label>ถึงวันที่</label>
          <input type="date" id="printDateTo" onchange="renderSelectedTemplate()">
        </div>

        <div class="filter-item" style="display: flex; flex-direction: row; gap: 6px; align-items: flex-end;">
          <button type="button" class="pill-btn" onclick="resetPrintFilters()" style="padding: 7px 12px; height: 35px; width: 100%;">
            <i class="fas fa-undo"></i> ล้างตัวกรอง
          </button>
        </div>

        <!-- 📑 Comprehensive Item-by-item Selection Bar (Screen Only) -->
        <div class="filter-item no-print" style="grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--slate-200); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 700; color: var(--primary-dark);">
              <input type="checkbox" id="chkIncludePhotos" onchange="toggleIncludePhotos(this.checked)" checked style="width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer;">
              <span>รวมหน้าภาคผนวกภาพถ่ายและรายละเอียด (พิมพ์แยกหน้าอัตโนมัติ)</span>
            </label>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <span style="font-size: 0.85rem; color: var(--slate-600); font-weight: 600;">เลือกพิมพ์เฉพาะข้อ:</span>
            <button type="button" class="pill-btn" onclick="selectAllItems(true)" style="padding: 4px 10px; font-size: 0.8rem; background: #f3e8ff; border-color: var(--primary-light); color: var(--primary-dark);">
              <i class="fas fa-check-square"></i> เลือกทั้งหมด
            </button>
            <button type="button" class="pill-btn" onclick="selectAllItems(false)" style="padding: 4px 10px; font-size: 0.8rem;">
              <i class="far fa-square"></i> ปลดเลือกทั้งหมด
            </button>
            <span id="selectionSummaryBadge" style="font-size: 0.82rem; font-weight: 700; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px;">
              เลือกแล้ว 0/0 รายการ
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 📄 Print Simulation Viewport -->
  <div class="print-viewport-container" id="printContainer">
    <!-- Rendered dynamically via print.js -->
  </div>

  <script src="js/print.js?v=20261111_02"></script>
</body>
</html>
